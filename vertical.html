<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小学计算闯关 · 一年级到六年级</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f1f4fa;--card:#fff;--ink:#151c2c;--muted:#6b7588;--line:#e3e8f2;
  --pri:#4a63d8;--pri-soft:#eef1ff;--ok:#1f9c66;--bad:#dc4f4f;--warn:#e8961a;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* 方案选择 */
/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px;position:sticky;top:0;z-index:30;background:linear-gradient(#f1f4fa 72%,rgba(241,244,250,0))}
.tstage{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(20,30,60,.05);max-width:100%}
.tstage:hover{border-color:#c2cce8}
.tg{font-size:11px;font-weight:800;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:2px 7px;flex:0 0 auto}
.tn{font-size:14.5px;font-weight:800;color:#1d2739;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpos{font-size:10.5px;color:#a3adc2;font-family:var(--mono);flex:0 0 auto}
.tarrow{color:#9aa5bb;font-size:9px;transition:transform .2s;flex:0 0 auto}
.tstage.open .tarrow{transform:rotate(180deg)}
.tprog{display:flex;align-items:center;gap:7px;flex:0 0 auto}

/* 折叠面板 */
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 14px 30px -22px rgba(20,30,60,.5)}
.panel.open{display:block}
.pblock{margin-bottom:14px}
.pblock:last-child{margin-bottom:0}
.plabel{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;color:#98a2b8;margin-bottom:7px}
.pfoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:11px}
.pfoot a{color:var(--pri);font-size:11.5px;text-decoration:none;border-bottom:1px solid rgba(74,99,216,.3)}

/* 方案选择 */
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plan{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;cursor:pointer;text-align:left;font-family:inherit;transition:.16s;position:relative}
.plan:hover{border-color:#c2cce8}
.plan.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(74,99,216,.09)}
.plan b{display:block;font-size:13px;margin-bottom:1px}
.plan span{font-size:11px;color:var(--muted);line-height:1.4;display:block}
.plan .k{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;color:var(--pri);background:#fff;border:1px solid #d9e0f5;border-radius:5px;padding:0 4px}
.plan.on .k{background:var(--pri);color:#fff;border-color:var(--pri)}

/* 年级 / 关卡网格 */
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.gtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:#68738c;cursor:pointer;font-family:inherit;transition:.14s}
.gtab:hover{border-color:#c2cce8}
.gtab.on{background:#1d2739;border-color:#1d2739;color:#fff}
.gtab .gdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#cbd4e6;margin-left:5px;vertical-align:middle}
.gtab .gdot.f{background:#1f9c66}
.gtab.on .gdot{background:rgba(255,255,255,.5)}
.gtab.on .gdot.f{background:#4be0a0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
.sc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font-family:inherit;font-size:12.5px;color:#3b4660;display:flex;gap:8px;align-items:flex-start;line-height:1.35;transition:.14s}
.sc:hover{border-color:#c2cce8}
.sc .num{width:19px;height:19px;border-radius:50%;background:#eef1f8;color:#95a0b5;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.sc.on{border-color:var(--pri);background:var(--pri-soft);color:#22305c;font-weight:700;box-shadow:0 0 0 2px rgba(74,99,216,.07)}
.sc.on .num{background:var(--pri);color:#fff}
.sc.done .num{background:#dff3e9;color:#1f9c66}
.sc.lock{opacity:.42;cursor:not-allowed}

/* 主体 */
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;padding:14px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(20,30,60,.04)}

/* 竖式板 */
.board{padding:16px 16px 18px;position:relative}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:4px;min-height:18px}
.qtag{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
/* 题目右下角：提示语在左，三个按钮贴右下 */
.bfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:6px}
.bfoot .verdict{flex:1 1 auto;min-width:0;text-align:left;margin:0;padding-bottom:7px}
.acts{display:flex;gap:8px;flex:0 0 auto}
.btn{border:1px solid var(--line);background:#fff;color:#39425a;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#c2cce8;background:#fafbff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}


.dots{display:flex;gap:3px}
.pdot{width:9px;height:9px;border-radius:50%;background:#d3dbea;transition:.22s}
.pdot.on{background:var(--pri);transform:scale(1.15)}
.dots.win .pdot{background:var(--ok)}
.cnt{font-size:11.5px;color:var(--muted);font-weight:700;font-family:var(--mono)}

.expr{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 2px;font-family:var(--mono)}

.stage{display:flex;justify-content:center;padding:8px 0 4px;min-height:280px;align-items:center}
/* 讲解时给气泡腾出底部空间（不加过渡，避免测量与真机不一致） */
.stage.bubble-on{min-height:344px;padding-bottom:58px}
/* 讲解时的算式气泡：浮在竖式下方，水平跟随当前列 */
.calc{position:absolute;z-index:25;pointer-events:none;
  background:#1d2739;color:#fff;border-radius:11px;padding:8px 14px;
  font-size:14px;font-weight:700;font-family:var(--mono);letter-spacing:.01em;
  white-space:nowrap;box-shadow:0 12px 24px -12px rgba(20,30,60,.75);
  opacity:0;transform:translateY(-8px) scale(.94);
  transition:opacity .18s,transform .2s,left .32s cubic-bezier(.3,1.25,.6,1)}
.calc.on{opacity:1;transform:translateY(0) scale(1)}
.calc::before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;
  width:11px;height:11px;background:#1d2739;transform:rotate(45deg);border-radius:2px}
.vs{display:grid;grid-template-columns:var(--tpl);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;color:#1b2438}
.vs-row{display:contents}
.vs-cell{height:56px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .2s,transform .22s}
.vs-cell.op{font-size:26px;color:#7a86a0;justify-content:flex-end;padding-right:3px}
.vs-cell.brk{align-self:stretch;border-left:2.6px solid #33405c;margin-left:2px;border-top-left-radius:3px}
.vs-cell.dot{height:auto;align-self:center;line-height:1}
.vs-cell.dot .dp{display:block;width:6px;height:6px;border-radius:50%;background:#3d4a66}
.vs-cell.dvr{justify-content:flex-end;padding-right:8px}
.vs-cell.in{height:auto;padding:0}
.vs-cell .z0{color:#c6cede;font-weight:500}
.vs-cell.hi{background:#eef2ff;transform:scale(1.06);z-index:2}
.vs-cell.hi::before{content:"";position:absolute;inset:3px 2px;border-radius:8px;background:rgba(74,99,216,.12);border:1.5px solid rgba(74,99,216,.5);
  box-shadow:0 0 0 0 rgba(74,99,216,.3);animation:hiPulse 1s ease-out infinite}
@keyframes hiPulse{0%{box-shadow:0 0 0 0 rgba(74,99,216,.28)}100%{box-shadow:0 0 0 10px rgba(74,99,216,0)}}
.vs-cell.hi > *{position:relative;z-index:1}

.carryrow .vs-cell{height:36px}
.carry{width:36px;height:30px;border-radius:8px;border:1.5px solid transparent;background:transparent;color:#93a0b8;
  font-size:12.5px;font-weight:800;font-family:var(--mono);cursor:pointer;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background .16s,color .16s,border-color .16s,transform .18s}
.carry::after{content:"";width:7px;height:7px;border-radius:50%;background:#d2dbeb;transition:.16s}
.carry.set::after{display:none}
.carry:hover{background:#eef2fb}
.carry:active{transform:scale(.94)}
.carry.set{border-style:solid;border-color:var(--pri);background:var(--pri);color:#fff;transform:scale(1.06)}
.carry.set.red{border-color:#d8593f;background:#d8593f}
.carry.pop{animation:pop .34s}
.carry.miss{border-color:#d8593f;box-shadow:0 0 0 3px rgba(216,89,63,.16)}
/* 讲解时数字「落」进格子；拨轮自己会滚，不需要这个 */
.vinp.drop{animation:dropin .38s cubic-bezier(.3,1.4,.6,1)}
@keyframes dropin{0%{transform:translateY(-10px) scale(.82);opacity:.25}
  62%{transform:translateY(1px) scale(1.06)}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.12)}100%{transform:scale(1.06)}}

.vs-row.hr{position:relative}
.vs-line{height:0;border-top:2.5px solid #33405c;align-self:center;margin:0 1px}

/* 结果输入 —— 拨轮（iPad 手触版：整轮可拖、上下各露半格） */
.dial{
  --dh:46px;                              /* 单个数字的高度 */
  position:relative;border-radius:13px;overflow:hidden;
  width:56px;height:calc(var(--dh) * 2);  /* 视窗 = 中间满格 + 上下各半格 */  border:1.5px solid #cdd8ec;
  background:linear-gradient(#e7edfa,#f9fbff 30%,#f9fbff 70%,#e7edfa);
  box-shadow:0 2px 5px rgba(22,40,80,.07),inset 0 12px 14px -12px rgba(22,40,80,.3),inset 0 -12px 14px -12px rgba(22,40,80,.3);
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;margin:3px 0 1px;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.dial.on{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft),inset 0 12px 14px -12px rgba(22,40,80,.3)}
.dial.ok{border-color:var(--ok);background:linear-gradient(#e4f7ee,#f5fdf9 30%,#f5fdf9 70%,#e4f7ee)}
.dial.bad{border-color:var(--bad);background:linear-gradient(#fdeded,#fef9f9 30%,#fef9f9 70%,#fdeded)}
.dstrip{position:relative;z-index:2;transition:transform .32s cubic-bezier(.34,1.42,.6,1);will-change:transform}
.dial.dragging .dstrip{transition:none}
.dnum{height:var(--dh);line-height:var(--dh);text-align:center;font-size:32px;font-weight:600;
  font-variant-numeric:tabular-nums;color:#aab5ca;letter-spacing:-.02em}
.dnum.cur{color:#141d33;font-weight:700}
.dnum.nb{color:#93a0bb}
.dnum.far{color:#c8d2e3}
/* 中间取景框：上下两条细线正好切在半格处 */
.dband{position:absolute;left:0;right:0;top:50%;height:var(--dh);transform:translateY(-50%);
  z-index:1;pointer-events:none;border-top:1px solid rgba(74,99,216,.22);border-bottom:1px solid rgba(74,99,216,.22);
  background:rgba(255,255,255,.42)}
/* 上下轻微渐隐，邻格的半截数字仍然看得清 */
.dfade{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(rgba(249,251,255,.62) 0%,rgba(249,251,255,.26) 12%,rgba(249,251,255,0) 30%,
             rgba(249,251,255,0) 70%,rgba(249,251,255,.26) 88%,rgba(249,251,255,.62) 100%)}
/* 上下半格就是「加一 / 减一」的触摸区，箭头贴在左侧不压数字 */
.dbtn{position:absolute;left:0;right:0;height:calc(var(--dh) * .62);border:0;padding:0;margin:0;
  background:transparent;cursor:pointer;z-index:4;display:flex;justify-content:flex-start;
  font-size:9px;line-height:1;color:#8e9ab4;opacity:.85;padding-left:4px;padding-right:0;
  -webkit-tap-highlight-color:transparent;transition:color .15s,opacity .15s}
.dbtn.up{top:0;align-items:flex-start;padding-top:2px}
.dbtn.dn{bottom:0;align-items:flex-end;padding-bottom:2px}
.dbtn:active,.dbtn:hover{color:var(--pri);opacity:1}
.dial.flash{animation:dialflash .42s}
@keyframes dialflash{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}

.vinp{width:52px;height:56px;border-radius:10px;border:1.5px solid #dfe5f2;background:#fbfcff;text-align:center;font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;color:#1b2438;outline:none;transition:.16s;padding:0}
.vinp:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px var(--pri-soft)}
.vinp.ok{border-color:var(--ok);background:#eefaf3}
.vinp.bad{border-color:var(--bad);background:#fdf0f0}

/* 数字键盘 */
.pad{display:none;grid-template-columns:repeat(5,1fr);gap:6px;max-width:330px;margin:14px auto 0}
.pad.show{display:grid}
.pad button{height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;font-family:var(--mono);cursor:pointer;color:#2a3348;transition:.12s}
.pad button:hover{background:var(--pri-soft);border-color:#c2cce8}
.pad button.del{font-size:12px;font-family:inherit;grid-column:1/-1;height:36px}

.verdict{text-align:center;margin-top:14px;font-size:13.5px;font-weight:600;min-height:22px}
.stage-hint{text-align:center;margin:0 0 2px;font-size:11.5px;color:#93a0b8}
.stage-hint b{color:#5b6b93;font-weight:700}
.verdict.good{color:var(--ok)}
.verdict.err{color:var(--bad)}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:12px}
.side .card{padding:14px}
.side h3{font-size:12.5px;margin:0 0 10px;font-weight:800;letter-spacing:.04em;color:#3a4460}
.steps{list-style:none;margin:0;padding:0;font-size:12.5px;color:#5b6580;max-height:300px;overflow:auto}
.steps li{padding:8px 9px 8px 30px;border-radius:8px;position:relative;margin-bottom:3px;line-height:1.6;transition:.2s}
.steps li::before{content:attr(data-n);position:absolute;left:7px;top:8px;width:16px;height:16px;border-radius:50%;background:#eef1f8;color:#8a94ab;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li.on{background:var(--pri-soft);color:#2b3a6e;font-weight:600}
.steps li.on::before{background:var(--pri);color:#fff}
.steps li.done::before{content:"✓";background:#dff3e9;color:var(--ok)}
.steps li.idle{opacity:.62}

.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;color:#5b6580}
.prow > span:first-child{width:62px;flex:0 0 auto}
.pbs{display:flex;gap:3px;flex:1}
.pb{height:6px;flex:1;border-radius:3px;background:#e8ecf5}
.pb.f{background:var(--ok)}
.pb.c{background:var(--pri)}
.pv{font-family:var(--mono);font-size:11px;color:#8b95ab;flex:0 0 auto}
.reset{background:none;border:0;color:#a3acbf;font-size:11px;font-family:inherit;cursor:pointer;padding:0;text-decoration:underline}
.reset:hover{color:var(--bad)}

.voice{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.voice label{font-size:12px;color:var(--muted);white-space:nowrap}
.voice select{flex:1 1 200px;min-width:0}
.sw{width:38px;height:22px;border-radius:999px;background:#d7ddec;border:0;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--pri)}
.sw.on::after{left:18px}
select{width:100%;border:1px solid var(--line);background:#fbfcff;border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;color:#3a4460;outline:none}
select:focus{border-color:var(--pri)}
.hint{font-size:11.5px;color:#8b95ab;line-height:1.6;margin:8px 0 0}

/* 提示条 */
.toast{position:fixed;left:50%;top:-96px;transform:translateX(-50%);opacity:0;background:#16233c;color:#fff;
  padding:12px 20px;border-radius:13px;z-index:60;box-shadow:0 14px 34px rgba(10,20,50,.3);
  display:flex;flex-direction:column;gap:3px;max-width:92vw;text-align:center;pointer-events:none;
  transition:top .3s cubic-bezier(.2,1.2,.5,1),opacity .24s ease}
.toast.show{top:14px;opacity:1}
.toast b{font-size:14px}
.toast span{font-size:12px;opacity:.82}

@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(31,156,102,0)}50%{box-shadow:0 0 0 6px rgba(31,156,102,.18)}}
.flash{animation:flash .9s 2}

@media (hover:none){ .dbtn{opacity:.8} }
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .plans{grid-template-columns:repeat(2,1fr);gap:6px}
  .plan{padding:8px 9px}
  .plan b{font-size:12.5px}
  .plan span:not(.k){display:none}
  .plan .k{top:6px;right:7px}
  .vs{grid-template-columns:var(--tplm);font-size:26px}
  .vs-cell{height:50px}
  .dial{--dh:44px;width:47px}
  .vinp{width:47px;height:50px}
  .dnum{font-size:28px}
  .stage{min-height:220px}
  .lv .s{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="tstage" id="btnPanel" aria-label="切换关卡与设置">
      <span class="tg" id="tbGrade">一年级</span>
      <span class="tn" id="tbStage">10 以内加法</span>
      <span class="tpos" id="tbPos">1/30</span>
      <span class="tarrow">▾</span>
    </button>
    <div class="tprog">
      <div class="dots" id="dots"></div>
      <span class="cnt" id="cnt">0/10</span>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="pblock">
      <span class="plabel">怎么答题</span>
      <div class="plans" id="plans">
        <button class="plan on" data-d="dial"><span class="k">A</span><b>拨轮转动</b><span>手指上下拨动数字轮，iPad 上最好用</span></button>
        <button class="plan" data-d="key"><span class="k">B</span><b>键盘输入</b><span>在竖式格子里直接打字</span></button>
      </div>
    </div>

    <div class="pblock">
      <span class="plabel">在哪一关 · 从一年级一路闯到六年级</span>
      <div class="gtabs" id="gtabs"></div>
      <div class="sgrid" id="sgrid"></div>
    </div>

    <div class="pblock">
      <span class="plabel">讲解方式</span>
      <p class="hint" style="margin:0">点题目右下角的「讲解」，会在竖式上<b>逐步动画演示</b>：正在算的那一列会亮起，下面浮出这一位的算式，进位自动落到上方，结果一位一位填进去。没有语音，看动画就够。</p>
    </div>

    <div class="pblock pfoot">
      <button class="reset" id="btnUnlockAll">解锁全部关卡（家长）</button>
      <button class="reset" id="btnReset">清空进度</button>
      <a href="index.html">知识纲要</a>
    </div>
  </div>

  <main>
    <section class="card board">
      <div class="bhead">
        <span class="qtag" id="qtag">—</span>
      </div>

<script>
/* =========================================================
   1. 工具
   ========================================================= */
const $ = s => document.querySelector(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const wait = ms => new Promise(r => setTimeout(r, ms));

const P_INT = ['个位','十位','百位','千位','万位'];
const P_DEC = ['十分位','百分位','千分位'];
const place = (k,d) => k<d ? P_DEC[d-1-k] : P_INT[k-d];

const digitsRev = n => String(n).split('').reverse().map(Number);

/* 进位次数（加） */
function countCarryAdd(a,b){
  const A=digitsRev(a), B=digitsRev(b), n=Math.max(A.length,B.length);
  let carry=0, cnt=0;
  for(let k=0;k<n;k++){
    const s=(A[k]||0)+(B[k]||0)+carry;
    carry = s>=10 ? 1 : 0;
    if(carry) cnt++;
  }
  return cnt;
}
/* 退位次数（减） */
function countBorrowSub(a,b){
  const A=digitsRev(a), B=digitsRev(b), n=Math.max(A.length,B.length);
  let borrow=0, cnt=0;
  for(let k=0;k<n;k++){
    const cur=(A[k]||0)-borrow;
    if(cur < (B[k]||0)){ borrow=1; cnt++; } else borrow=0;
  }
  return cnt;
}
/* 乘法进位次数 */
function countCarryMul(a,b){
  let carry=0, cnt=0;
  for(const d of digitsRev(a)){
    const p=d*b+carry;
    carry=Math.floor(p/10);
    if(carry) cnt++;
  }
  return cnt;
}
/* 除法：每一步的商都不能是 0，否则竖式排版要另做处理 */
function divOk(a,b){
  let r=0;
  for(const d of String(a).split('').map(Number)){
    const cur=r*10+d;
    const q=Math.floor(cur/b);
    if(q<1) return false;
    r=cur-q*b;
  }
  return true;
}

/* =========================================================
   2. 竖式构造器
   产出 { expr, cols, rows, inputs, carries, steps, answer }
   ========================================================= */
function buildAddSub(o){
  const op=o.op, da=o.da||0, db=o.db||0, d=Math.max(da,db);
  const sc=Math.pow(10,d);
  const ai=Math.round(o.a*sc), bi=Math.round(o.b*sc);
  const ci = op==='+' ? ai+bi : ai-bi;
  const N = Math.max(String(ai).length, String(bi).length, String(ci).length);
  const C = N + (d>0?1:0);
  const dotCol = d>0 ? N-d : -1;
  const colOf = p => p + ((d>0 && p>=N-d) ? 1 : 0);
  const sA=String(ai).padStart(N,' ').split('');
  const sB=String(bi).padStart(N,' ').split('');
  const sC=String(ci).padStart(N,' ').split('');
  const dv=(s,p)=> (s[p]===undefined || s[p]===' ') ? 0 : Number(s[p]);
  const blank=()=>Array.from({length:C},()=>({t:'sp'}));

  const numRow=(s,myDec)=>{
    const cells=blank();
    for(let p=0;p<N;p++){
      const ch=s[p];
      if(ch===' ') continue;
      const k=N-1-p;
      cells[colOf(p)] = (d>0 && k<d-myDec) ? {t:'pad0'} : {t:'d', v:ch};
    }
    if(dotCol>=0) cells[dotCol]={t:'dot'};
    return cells;
  };

  const resCells=blank();
  for(let p=0;p<N;p++) if(sC[p]!==' ') resCells[colOf(p)]={t:'in', id:'r'+p};
  if(dotCol>=0) resCells[dotCol]={t:'dot'};

  const carryCells=blank();
  const carries=[], steps=[];

  if(op==='+'){
    let carry=0;
    for(let k=0;k<N;k++){
      const p=N-1-k, col=colOf(p);
      const x=dv(sA,p), y=dv(sB,p);
      if(sA[p]===' ' && sB[p]===' '){
        if(carry>0 && sC[p]!==' '){
          steps.push({hi:[col], ex:'进位 '+carry+'，直接落下', text: place(k,d)+'：只剩进上来的 '+carry+'，直接写下来。', set:[{id:'r'+p, v:String(carry)}]});
        }
        carry=0;
        continue;
      }
      const sum=x+y+carry;
      const base = place(k,d)+'：'+x+' 加 '+y+(carry?'，再加进位的 '+carry:'')+' 等于 '+sum+'。';
      if(sum>=10){
        const out=Math.floor(sum/10), ccol=colOf(p-1);
        const cid='c'+ccol;
        if(p-1>=0){ carryCells[ccol]={t:'carry', id:cid}; carries.push({id:cid, ans:String(out)}); }
        steps.push({hi:[col], ex:(d>0?place(k,d)+' ':'')+x+' + '+y+(carry?' + '+carry:'')+' = '+sum, text: base+'满十，写 '+(sum%10)+'，向'+place(k+1,d)+'进 '+out+'。',
          set:[{id:'r'+p, v:String(sum%10)}], carry:{id:cid, v:String(out)}});
        carry=out;
      } else {
        steps.push({hi:[col], ex:(d>0?place(k,d)+' ':'')+x+' + '+y+(carry?' + '+carry:'')+' = '+sum, text: base+'写 '+sum+'，不进位。', set:[{id:'r'+p, v:String(sum)}]});
        carry=0;
      }
    }
  } else {
    let bor=0;
    for(let k=0;k<N;k++){
      const p=N-1-k, col=colOf(p);
      if(sC[p]===' '){ bor=0; continue; }
      const x=dv(sA,p), y=dv(sB,p);
      let cur=x-bor, took=false, cid=null;
      if(cur<y && p-1>=0){ took=true; cur+=10; cid='c'+colOf(p-1); }
      const rd=cur-y;
      if(took){
        carryCells[colOf(p-1)]={t:'carry', id:cid};
        carries.push({id:cid, ans:'-1'});
      }
      let txt;
      if(took && x===0 && bor===1){
        txt = place(k,d)+'是 0，先向'+place(k+1,d)+'借 1 当 10，再借给'+place(k-1,d)+' 1，剩 9。9 减 '+y+' 等于 '+rd+'。';
      } else if(took){
        txt = place(k,d)+'：'+x+(bor?' 被借走 1 剩 '+(x-1):'')+' 减 '+y+' 不够减，向'+place(k+1,d)+'借 1 当 10，'+cur+' 减 '+y+' 等于 '+rd+'。';
      } else {
        txt = place(k,d)+'：'+x+(bor?' 被借走 1 剩 '+cur:'')+' 减 '+y+' 等于 '+rd+'。';
      }
      steps.push({hi:[col], ex:(d>0?place(k,d)+' ':'')+(took?'('+x+' + 10) − '+y+' = '+rd : cur+' − '+y+' = '+rd), text:txt,
        set:[{id:'r'+p, v:String(rd)}], carry: took?{id:cid, v:'-1', red:true}:null});
      bor = took?1:0;
    }
  }

  const answer = d>0 ? (ci/sc).toFixed(d) : String(ci);
  if(steps.length) steps[steps.length-1].text += ' 答案是 '+answer+'。';

  const exprA = da>0 ? o.a.toFixed(da) : String(o.a);
  const exprB = db>0 ? o.b.toFixed(db) : String(o.b);

  return {
    expr: exprA + (op==='+'?' + ':' − ') + exprB + ' = ?',
    cols: C, dotCol,
    rows: [
      {type:'cells', cls:'carryrow', cells:carryCells},
      {type:'cells', op:'', cells:numRow(sA,da)},
      {type:'cells', op: op==='+'?'+':'−', cells:numRow(sB,db)},
      {type:'line', from:0, to:C-1},
      {type:'cells', cls:'res', cells:resCells}
    ],
    inputs: (()=>{ const out=[]; for(let p=0;p<N;p++) if(sC[p]!==' ') out.push({id:'r'+p, ans:sC[p]}); return out; })(),
    carries, steps, answer
  };
}

function buildMul(o){
  const a=o.a, b=o.b, s=a*b;
  const ds=String(a).split('').map(Number), na=ds.length;
  const N=Math.max(na, String(s).length);
  const blank=()=>Array.from({length:N},()=>({t:'sp'}));
  const sA=String(a).padStart(N,' ').split('');
  const sB=String(b).padStart(N,' ').split('');
  const sS=String(s).padStart(N,' ').split('');
  const aCells=blank(), bCells=blank(), rCells=blank(), carCells=blank();
  sA.forEach((ch,p)=>{ if(ch!==' ') aCells[p]={t:'d', v:ch}; });
  sB.forEach((ch,p)=>{ if(ch!==' ') bCells[p]={t:'d', v:ch}; });
  sS.forEach((ch,p)=>{ if(ch!==' ') rCells[p]={t:'in', id:'r'+p}; });

  const plan=[]; let carry=0;
  for(let k=0;k<na;k++){
    const p=N-1-k, dgt=ds[na-1-k];
    const prod=dgt*b+carry;
    plan.push({k,p,dgt,prod,carryIn:carry});
    carry=Math.floor(prod/10);
  }

  const steps=[], carries=[];
  plan.forEach(st=>{
    const out=Math.floor(st.prod/10);
    const base = place(st.k,0)+'：'+st.dgt+' 乘 '+b+(st.carryIn?'，再加进位的 '+st.carryIn:'')+' 等于 '+st.prod+'。';
    if(out>0 && st.p-1>=0){
      const cid='c'+(st.p-1);
      carCells[st.p-1]={t:'carry', id:cid};
      carries.push({id:cid, ans:String(out)});
      steps.push({hi:[st.p], ex:st.dgt+' × '+b+(st.carryIn?' + '+st.carryIn:'')+' = '+st.prod,
        text: base+'写 '+(st.prod%10)+'，向'+place(st.k+1,0)+'进 '+out+'。',
        set:[{id:'r'+st.p, v:String(st.prod%10)}], carry:{id:cid, v:String(out)}});
    } else {
      steps.push({hi:[st.p], ex:st.dgt+' × '+b+(st.carryIn?' + '+st.carryIn:'')+' = '+st.prod,
        text: base+'写 '+st.prod+'。', set:[{id:'r'+st.p, v:String(st.prod)}]});
    }
  });
  if(carry>0 && steps.length){
    const p0=N-1-na;
    steps.push({hi:[p0], ex:'进位 '+carry+' 写在最前面', text:'最后把进上来的 '+carry+' 写在最前面。答案是 '+s+'。', set:[{id:'r'+p0, v:String(carry)}]});
  } else if(steps.length){
    steps[steps.length-1].text += ' 答案是 '+s+'。';
  }

  const inputs=[];
  for(let p=0;p<N;p++) if(sS[p]!==' ') inputs.push({id:'r'+p, ans:sS[p]});

  return {
    expr: a+' × '+b+' = ?', cols: N, dotCol: -1,
    rows: [
      {type:'cells', cls:'carryrow', cells:carCells},
      {type:'cells', op:'', cells:aCells},
      {type:'cells', op:'×', cells:bCells},
      {type:'line', from:0, to:N-1},
      {type:'cells', cls:'res', cells:rCells}
    ],
    inputs, carries, steps, answer:String(s)
  };
}

function buildDiv(o){
  const a=o.a, b=o.b;
  const ds=String(a).split('').map(Number), nd=ds.length;
  const C=2+nd;
  const blank=()=>Array.from({length:C},()=>({t:'sp'}));

  /* 先从左取够比除数大的前缀，商的位数 = nd - k + 1 */
  let k=0, cur=0;
  while(k<nd){ cur=cur*10+ds[k]; k++; if(cur>=b) break; }

  const info=[]; let r=cur;
  for(let i=k-1;i<nd;i++){
    if(i>k-1) r=r*10+ds[i];
    const q=Math.floor(r/b), prod=q*b, rem=r-prod;
    info.push({i,cur:r,q,prod,rem});
    r=rem;
  }
  const qnum=Number(info.map(x=>x.q).join(''));
  const remFinal=r;

  const qCells=blank();
  info.forEach(x=>{ qCells[2+x.i]={t:'in', id:'q'+x.i}; });

  const dCells=blank();
  dCells[0]={t:'d', v:String(b), cls:'dvr'};
  dCells[1]={t:'brk'};
  ds.forEach((v,i2)=>{ dCells[2+i2]={t:'d', v:String(v)}; });

  const rows=[
    {type:'cells', cls:'qrow', cells:qCells},
    {type:'line', from:1, to:C-1},
    {type:'cells', op:'', cells:dCells}
  ];

  const steps=[], inputs=[];
  info.forEach((x,xi)=>{
    inputs.push({id:'q'+x.i, ans:String(x.q)});

    const ps=String(x.prod), startCol=2+x.i-(ps.length-1);
    let rs=String(x.rem), endCol=2+x.i;
    const isLast = x.i===nd-1;
    if(!isLast){ rs+=String(ds[x.i+1]); endCol=3+x.i; }
    const rStart=endCol-(rs.length-1);

    const pCells=blank();
    for(let j2=0;j2<ps.length;j2++) pCells[startCol+j2]={t:'d', v:ps[j2]};
    rows.push({type:'cells', op:'', cells:pCells});
    rows.push({type:'line', from:Math.max(2, rStart), to:endCol});

    const vCells=blank();
    for(let j2=0;j2<rs.length;j2++){
      const col=rStart+j2;
      vCells[col] = isLast ? {t:'in', id:'m'+j2} : {t:'d', v:rs[j2]};
    }
    rows.push({type:'cells', op:'', cells:vCells});

    const takeTxt = '前面剩下 '+x.cur+'，';
    if(xi===0){
      steps.push({hi:[2+x.i], ex:x.cur+' ÷ '+b+' = '+x.q, text:'先看被除数的前 '+k+' 位，'+x.cur+' ÷ '+b+' 商 '+x.q+'，把 '+x.q+' 写在 '+ds[x.i]+' 的上面。',
        set:[{id:'q'+x.i, v:String(x.q)}]});
    } else {
      steps.push({hi:[2+x.i], ex:x.cur+' ÷ '+b+' = '+x.q, text:'把下一位 '+ds[x.i]+' 落下来，'+takeTxt+'除以 '+b+' 商 '+x.q+'。',
        set:[{id:'q'+x.i, v:String(x.q)}]});
    }
    steps.push({hi:[2+x.i], ex:x.cur+' − '+x.q+' × '+b+' = '+x.rem, text:x.q+' 乘 '+b+' 等于 '+x.prod+'，'+x.cur+' 减 '+x.prod+' 等于 '+x.rem+'。',
      set: isLast? String(x.rem).split('').map((ch,j)=>({id:'m'+j, v:ch})) : []});
  });
  /* 余数可能是两位数，逐位一个输入格 */
  String(remFinal).split('').forEach((ch,j)=>inputs.push({id:'m'+j, ans:ch}));

  const answer = remFinal>0 ? qnum+' 余 '+remFinal : String(qnum);
  steps[steps.length-1].text += ' 所以 '+a+' ÷ '+b+' = '+answer+'，余数比除数小，做对了。';

  return {
    expr: a+' ÷ '+b+' = ? …… ?', cols:C, dotCol:-1, rows, inputs, carries:[], steps, answer
  };
}

}
function genA20(){
  let a,b,g=0; do{ a=ri(6,9); b=ri(4,9); g++; }while((a+b<=10 || a+b>18) && g<300);
  return buildAddSub({a,b,op:'+',da:0,db:0});
}
function genS20(){
  let a,b,g=0; do{ a=ri(11,18); b=ri(2,9); g++; }while((a%10>=b || a-b<1) && g<300);
  return buildAddSub({a,b,op:'-',da:0,db:0});
}
function genA100n(){
  let a,b,g=0; do{ a=ri(11,44); b=ri(11,44); g++; }
  while(((a%10)+(b%10)>=10 || Math.floor(a/10)+Math.floor(b/10)>=10) && g<600);
  return buildAddSub({a,b,op:'+',da:0,db:0});
}
function genS100n(){
  let a,b,g=0; do{ a=ri(33,98); b=ri(11,a-1); g++; }
  while((a%10<b%10 || Math.floor(a/10)<=Math.floor(b/10)) && g<800);
  return buildAddSub({a,b,op:'-',da:0,db:0});
}
function genTable(){ return buildMul({a:ri(2,9), b:ri(2,9)}); }
function genTableDiv(){
  let b,q,r,a,g=0;
  do{ b=ri(2,9); q=ri(2,9); r=ri(0,b-1); a=b*q+r; g++; }while((a<10 || a>81) && g<400);
  return buildDiv({a,b});
}

/* 两位数 / 多位数乘两位数（部分积两行） */
function buildMulN(a,b){
  const total=a*b;
  const N=Math.max(String(a).length, String(b).length, String(total).length);
  const blank=()=>Array.from({length:N},()=>({t:'sp'}));
  const sA=String(a).padStart(N,' ').split('');
  const sB=String(b).padStart(N,' ').split('');
  const sT=String(total).padStart(N,' ').split('');
  const aCells=blank(), bCells=blank(), tCells=blank();
  sA.forEach((ch,p)=>{ if(ch!==' ') aCells[p]={t:'d',v:ch}; });
  sB.forEach((ch,p)=>{ if(ch!==' ') bCells[p]={t:'d',v:ch}; });
  sT.forEach((ch,p)=>{ if(ch!==' ') tCells[p]={t:'in', id:'r'+p}; });

  const dsB=String(b).split('').reverse().map(Number);   /* 低位在前 */
  const partRows=[], inputs=[], steps=[];
  dsB.forEach((dgt,k)=>{
    const val=a*dgt, str=String(val), end=N-1-k;
    const cells=blank();
    for(let j=0;j<str.length;j++){
      const col=end-(str.length-1-j);
      cells[col]={t:'in', id:'p'+k+'_'+j};
      inputs.push({id:'p'+k+'_'+j, ans:str[j]});
    }
    partRows.push({type:'cells', op:'', cells});

    const word = k===0 ? place(0,0) : place(k,0);
    steps.push({hi:[end], ex:a+' × '+dgt+' = '+val,
      text: word+'：'+a+' 乘 '+dgt+' 等于 '+val+'，'+(k?'写在'+place(k,0)+'起':'写在个位起')+'。',
      set:str.split('').map((ch,j)=>({id:'p'+k+'_'+j, v:ch}))});
  });
  const resInputs=[];
  sT.forEach((ch,p)=>{ if(ch!==' ') resInputs.push({id:'r'+p, ans:ch}); });

  const shiftNote = dsB.length>1
    ? '把两次乘得的结果加起来：'+dsB.map((d,k)=>a*d*Math.pow(10,k)).join(' 加 ')+' 等于 '+total+'。'
    : '答案是 '+total+'。';
  steps.push({hi:[N-1], ex: dsB.map((d,k)=>a*d*Math.pow(10,k)).join(' + ')+' = '+total,
    text: shiftNote, set: resInputs.map(x=>({id:x.id, v:x.ans}))});

  const rows=[{type:'cells', op:'', cells:aCells},
              {type:'cells', op:'×', cells:bCells},
              {type:'line', from:0, to:N-1}]
              .concat(partRows)
              .concat([{type:'line', from:0, to:N-1},{type:'cells', cls:'res', cells:tCells}]);
  if(dsB.length===1) rows.splice(4,1);   // 只有一位乘数时不要两条线

  return {expr:a+' × '+b+' = ?', cols:N, dotCol:-1, rows, inputs:inputs.concat(resInputs), carries:[], steps, answer:String(total)};
}

function genMul2x2(){
  let a,b,g=0; do{ a=ri(12,49); b=ri(12,49); g++; }while((a%10===0 || b%10===0) && g<300);
  return buildMulN(a,b);
}
function genMul2x2h(){
  let a,b,g=0; do{ a=ri(23,89); b=ri(23,89); g++; }
  while(((a%10)*(b%10)<20) && g<600);
  return buildMulN(a,b);
}
function genMul3x2h(){
  let a,b,g=0; do{ a=ri(345,897); b=ri(34,89); g++; }while(((a%10)*(b%10)<30) && g<600);
  return buildMulN(a,b);
}
function genMul3x2(){
  let a,b,g=0; do{ a=ri(123,489); b=ri(23,79); g++; }while(b%10===0 && g<300);
  return buildMulN(a,b);
}

/* 除数是两位数 */
function genDiv2d(){
  let b,q,r,a,g=0;
  do{ b=ri(12,29); q=ri(3,30); r=ri(0,b-1); a=b*q+r; g++; }while((a<100 || a>999) && g<900);
  return buildDiv({a,b});
}
function genDiv2dR(){
  let b,q,r,a,g=0;
  do{ b=ri(13,29); q=ri(5,39); r=ri(1,b-1); a=b*q+r; g++; }while((a<100 || a>999) && g<900);
  return buildDiv({a,b});
}

/* 小数减法 */
function genDecSub1(){
  let a,b,g=0; do{ a=ri(21,89); b=ri(11,a-5); g++; }
  while((b<=0 || a%10===0 || b%10===0 || (a-b)%10===0) && g<900);
  return buildAddSub({a:a/10, b:b/10, op:'-', da:1, db:1});
}
function genDecSub2(){
  let a,b,g=0; do{ a=ri(105,899); b=ri(101,a-5); g++; }
  while((a%10===0 || b%10===0 || (a-b)%10===0) && g<1200);
  return buildAddSub({a:a/100, b:b/100, op:'-', da:2, db:2});
}
function genDecSub3(){
  let a,b,g=0; do{ a=ri(150,899); b=ri(15,Math.min(99,a/10-1)); g++; }
  while((a%10===0 || b%10===0 || (a-b*10)%10===0) && g<1200);
  return buildAddSub({a:a/100, b:b/10, op:'-', da:2, db:1});
}
function genDecMix(){
  const pool=[genDec2,genDec3,genDec4,genDecSub1,genDecSub2,genDecSub3];
  return pool[ri(0,pool.length-1)]();
}
function genMixed(){
  const pool=[genAdd4,genSub4,genMul3,genMul2x2,genMul2x2h,genMul3x2,genDiv2d,genDiv3,genDec3,genDecSub2];
  return pool[ri(0,pool.length-1)]();
}

const STAGES = [];
LEVELS.forEach((lv,gi)=>lv.stages.forEach((st,si)=>{
  STAGES.push(Object.assign({}, st, {gi, gName:lv.name, si}));
}));

/* =========================================================
   4. 进度（连对与阶梯）
   ========================================================= */
const GOAL = 10;
const KEY = 'pm_path_v2';
let prog = {i:0, streak:0, max:0, unlock:false};
try{
  const raw = JSON.parse(localStorage.getItem(KEY)||'null');
  if(raw && typeof raw.i==='number') prog = Object.assign(prog, raw);
}catch(e){}
if(prog.i<0 || prog.i>=STAGES.length) prog.i = 0;
prog.max = Math.max(prog.max||0, prog.i);

function saveProg(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }
function curStage(){ return STAGES[Math.min(prog.i, STAGES.length-1)]; }

let toastTimer = null;
function toast(title, sub){
  $('#toastT').textContent = title;
  $('#toastS').textContent = sub;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('#toast').classList.remove('show'), 2800);
}

/* =========================================================
   5. 状态与渲染
   ========================================================= */
const state = { design:'dial', gtab:STAGES[prog.i].gi, q:null, res:{}, car:{}, playing:false, n:0, answered:false };
let playToken = 0, lastInput = null, autoTimer = null;

const HINT = {
  dial: '手指按住数字轮 <b>上下拨动</b> 就能转（也可点 ▲ ▼）；竖式上方的小圆点是<b>进位</b>（减法时是退位），点一下切换 +1 / +2 / +3 或 −1 / −2 / −3。',
  key:  '在竖式格子里直接打字，会自动跳到下一位；上方小圆点是<b>进位</b>（减法时是退位），点一下切换 +1 / +2 / +3 或 −1 / −2 / −3。'
};

/* 顶部一行 + 折叠面板 */
function renderPath(){
  const st = curStage();
  $('#tbGrade').textContent = st.gName;
  $('#tbStage').textContent = st.label;
  $('#tbPos').textContent = (prog.i+1) + '/' + STAGES.length;

  let dots='';
  for(let k=0;k<GOAL;k++) dots += '<i class="pdot'+(k<prog.streak?' on':'')+'"></i>';
  $('#dots').innerHTML = dots;
  $('#dots').classList.toggle('win', prog.streak>=GOAL);
  $('#cnt').textContent = prog.streak + '/' + GOAL;

  $('#gtabs').innerHTML = LEVELS.map((lv,gi)=>{
    const from = STAGES.findIndex(x=>x.gi===gi);
    const allDone = STAGES.filter(x=>x.gi===gi).every(x=>STAGES.indexOf(x) < prog.i);
    return '<button class="gtab'+(gi===state.gtab?' on':'')+'" data-g="'+gi+'">'+lv.name+
      '<i class="gdot'+(allDone?' f':'')+'"></i></button>';
  }).join('');

  const lv = LEVELS[state.gtab];
  $('#sgrid').innerHTML = lv.stages.map((x,si)=>{
    const idx = STAGES.findIndex(y=>y.gi===state.gtab && y.si===si);
    const locked = idx > prog.max && !prog.unlock;
    const cls = idx===prog.i ? 'on' : (idx<prog.i ? 'done' : (locked?'lock':''));
    const mark = idx<prog.i ? '✓' : (idx===prog.i ? '●' : (si+1));
    return '<button class="sc '+cls+'" data-i="'+idx+'"'+(locked?' disabled':'')+'>'+
      '<span class="num">'+mark+'</span><span>'+x.label+'</span></button>';
  }).join('');
}

function renderStage(){
  const q = state.q;
  const dc = (typeof q.dotCol === 'number') ? q.dotCol : -1;
  let tpl='36px', tplm='28px';
  for(let i=0;i<q.cols;i++){
    tpl  += ' ' + (i===dc ? 24 : 58) + 'px';
    tplm += ' ' + (i===dc ? 20 : 50) + 'px';
  }
  let html = '<div class="vs" style="--tpl:'+tpl+';--tplm:'+tplm+'">';
  q.rows.forEach((row,ri)=>{
    const gr = 'grid-row:'+(ri+1)+';';
    if(row.type==='line'){
      html += '<div class="vs-line" style="'+gr+'grid-column:'+(row.from+2)+' / span '+(row.to-row.from+1)+'"></div>';
      return;
    }
    html += '<div class="vs-cell op" style="'+gr+'">'+(row.op||'')+'</div>';
    row.cells.forEach((c,ci)=>{ html += cellHTML(c,ci,gr); });
  });
  html += '</div>';
  $('#stage').innerHTML = html;
}

function cellHTML(c, ci, gr){
  const col = ' data-col="'+ci+'" style="'+(gr||'')+'"';
  if(c.t==='d')     return '<div class="vs-cell '+(c.cls||'')+'"'+col+'>'+c.v+'</div>';
  if(c.t==='sp')    return '<div class="vs-cell sk"'+col+'></div>';
  if(c.t==='dot')   return '<div class="vs-cell dot"'+col+'><i class="dp"></i></div>';
  if(c.t==='pad0')  return '<div class="vs-cell"'+col+'><span class="z0">0</span></div>';
  if(c.t==='brk')   return '<div class="vs-cell brk"'+col+'></div>';
  if(c.t==='carry') return '<div class="vs-cell cc"'+col+'><button class="carry" data-cid="'+c.id+'"></button></div>';
  if(c.t==='in')    return '<div class="vs-cell in"'+col+'>'+inputHTML(c.id)+'</div>';
  return '<div class="vs-cell"'+col+'></div>';
}

const DIAL_PAD = 3;   /* 数字带在 0 上下各多铺 3 格，保证拖动能滚到相邻数 */

function inputHTML(id){
  if(state.design==='dial'){
    let nums = '';
    for(let i=-DIAL_PAD;i<=9+DIAL_PAD;i++) nums += '<div class="dnum">'+(((i%10)+10)%10)+'</div>';
    return '<div class="dial" data-id="'+id+'" role="spinbutton" aria-label="结果数字：上下拖动或点上下箭头">'+
      '<div class="dstrip">'+nums+'</div>'+
      '<i class="dband"></i><i class="dfade"></i>'+
      '<button class="dbtn up" data-step="1" aria-label="加一">▲</button>'+
      '<button class="dbtn dn" data-step="-1" aria-label="减一">▼</button></div>';
  }
  return '<input class="vinp" data-id="'+id+'" inputmode="numeric" maxlength="1" autocomplete="off">';
}

/* 把某个拨轮滚到数字 v：v 居中，上下各露半格。instant=true 时不走动画（初始化用） */
function placeDial(el, v, instant){
  const dh = el.querySelector('.dnum').offsetHeight || 46;
  const strip = el.querySelector('.dstrip');
  if(instant) strip.style.transition = 'none';
  strip.style.transform = 'translateY(' + (-(Number(v) + DIAL_PAD - 0.5) * dh) + 'px)';
  if(instant){ void strip.offsetWidth; strip.style.transition = ''; }
  const k = Number(v) + DIAL_PAD;
  el.querySelectorAll('.dnum').forEach((n,i)=>{
    const dst = Math.abs(i - k);
    n.className = 'dnum' + (dst === 0 ? ' cur' : dst === 1 ? ' nb' : ' far');
  });
  return dh;
}

function setResult(id, v, animate){
  state.res[id] = String(v);
  if(state.design==='dial'){
    /* 拨轮自己会滚动到位，滚动本身就是动画 */
    const el = document.querySelector('.dial[data-id="'+id+'"]');
    if(el) placeDial(el, v);
  } else {
    const el = document.querySelector('.vinp[data-id="'+id+'"]');
    if(el){
      el.value = v;
      if(animate){
        el.classList.remove('drop'); void el.offsetWidth; el.classList.add('drop');
      }
    }
  }
}

function setCarry(id, v, red){
  const btn = document.querySelector('.carry[data-cid="'+id+'"]');
  if(!btn) return;
  state.car[id] = v ? String(v) : '';
  btn.textContent = v ? (String(v).charAt(0)==='-' ? '−'+String(v).slice(1) : '+'+String(v)) : '';
  btn.classList.toggle('set', !!v);
  btn.classList.toggle('red', !!red || String(v).charAt(0)==='-');
  btn.classList.remove('pop');
  void btn.offsetWidth;
  btn.classList.add('pop');
}

function highlight(cols){
  (cols||[]).forEach(c=>{
    document.querySelectorAll('.vs-cell[data-col="'+c+'"]').forEach(el=>{
      /* 进位格自己会弹跳、空格格只是占位，都不跟着整列高亮，否则空框看起来像要填东西 */
      if(el.classList.contains('cc') || el.classList.contains('sk')) return;
      el.classList.add('hi');
    });
  });
}
function unhighlight(){ document.querySelectorAll('.vs-cell.hi').forEach(el=>el.classList.remove('hi')); }

function renderSteps(){
  $('#stepList').innerHTML = state.q.steps.map((s,i)=>
    '<li class="idle" data-n="'+(i+1)+'">'+s.text+'</li>').join('');
}
function markStep(i){
  const lis = document.querySelectorAll('#stepList li');
  lis.forEach((li,k)=>{
    li.classList.remove('idle');
    li.classList.toggle('on', k===i);
    li.classList.toggle('done', k<i);
  });
  if(lis[i]) lis[i].scrollIntoView({block:'nearest'});
}
function markAllDone(){
  document.querySelectorAll('#stepList li').forEach(li=>{
    li.classList.remove('idle','on'); li.classList.add('done');
  });
}

/* =========================================================
   7. 讲解播放
   ========================================================= */
function endPlay(){
  state.playing = false;
  $('#btnPlay').disabled = false;
  $('#stage').classList.remove('bubble-on');
  $('#calc').classList.remove('on');
}

/* 算式气泡：浮在竖式下方，水平对准正在算的那一列 */
function showCalc(st){
  const c = $('#calc');
  if(!st || !st.ex){ c.classList.remove('on'); return; }
  c.textContent = st.ex;
  c.classList.add('on');
  const board = document.querySelector('.board').getBoundingClientRect();
  const col = (st.hi && st.hi.length) ? st.hi[0] : null;
  const cell = (col!==null) ? document.querySelector('.vs-cell[data-col="'+col+'"]') : null;
  const vs = document.querySelector('.vs');
  let cx = board.width / 2;
  if(cell){
    const r = cell.getBoundingClientRect();
    cx = r.left + r.width / 2 - board.left;
  }
  const w = c.offsetWidth || 140;
  c.style.left = Math.max(8, Math.min(board.width - w - 8, cx - w / 2)) + 'px';
  /* 紧贴竖式下方 12px：无论舞台多高都不会压住数字 */
  const vsBottom = vs ? vs.getBoundingClientRect().bottom - board.top : 0;
  c.style.top = (vsBottom + 12) + 'px';
  /* 长除法这类高竖式，气泡会落到屏幕外：最小幅度滚动让它回到视野 */
  requestAnimationFrame(()=>{
    const r = c.getBoundingClientRect();
    if(r.bottom > window.innerHeight - 10 || r.top < 56){
      c.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
  });
}

/* 逐步动画演示：高亮当前列 → 算式气泡 → 数字/进位落下 → 停一下再走下一步 */
async function play(){
  if(state.playing) return;
  clearTimeout(autoTimer);
  const my = ++playToken;
  state.playing = true;
  $('#btnPlay').disabled = true;
  $('#verdict').textContent = '';
  $('#verdict').className = 'verdict';
  resetInputs();
  renderSteps();
  $('#stage').classList.add('bubble-on');
  await wait(300);

  const steps = state.q.steps;
  for(let i=0;i<steps.length;i++){
    if(my !== playToken){ endPlay(); return; }
    const st = steps[i];
    markStep(i);
    highlight(st.hi);
    showCalc(st);
    await wait(430);
    if(my !== playToken){ endPlay(); return; }

    if(st.set) st.set.forEach(x=>setResult(x.id, x.v, true));
    if(st.carry) setCarry(st.carry.id, st.carry.v, st.carry.red);
    await wait(830);
    if(my !== playToken){ endPlay(); return; }

    unhighlight();
    const last = i === steps.length-1;
    if(!last) await wait(70);
  }
  if(my !== playToken){ endPlay(); return; }

  markAllDone();
  state.playing = false;
  $('#btnPlay').disabled = false;
  $('#calc').classList.remove('on');
  $('#verdict').textContent = '讲解完毕 · 答案是 ' + state.q.answer;
  $('#verdict').className = 'verdict good';
  setTimeout(()=>{ if(my===playToken) $('#stage').classList.remove('bubble-on'); }, 700);
}

function resetInputs(){
  state.res = {}; state.car = {};
  document.querySelectorAll('.dial').forEach(d=>{
    placeDial(d, 0, true);
    d.classList.remove('ok','bad','on','dragging','flash');
  });
  document.querySelectorAll('.vinp').forEach(i=>{ i.value=''; i.classList.remove('ok','bad'); });
  document.querySelectorAll('.carry').forEach(b=>{ b.textContent=''; b.classList.remove('set','red','pop'); });
  if(state.design==='dial') state.q.inputs.forEach(i=>state.res[i.id]='0');
}

/* =========================================================
   8. 判题 · 连对 · 阶梯
   ========================================================= */
function onRight(){
  state.answered = true;
  const st = curStage();
  prog.streak++;

  if(prog.streak >= GOAL){
    if(prog.i < STAGES.length-1){
      prog.i++; prog.max = Math.max(prog.max, prog.i); prog.streak = 0;
      const nx = curStage();
      state.gtab = nx.gi;
      saveProg(); renderPath();
      $('#verdict').textContent = '连对 10 题 · 「'+st.label+'」通过！下一关：'+nx.label;
      $('#verdict').className = 'verdict good';
      celebrateDots();
      toast(st.gName+' · '+st.label+' 通过', '进入 '+nx.gName+' · '+nx.label);
      state.n = 0;
      autoTimer = setTimeout(newQuestion, 2400);
    } else {
      prog.streak = 0;
      saveProg(); renderPath();
      $('#verdict').textContent = '连对 10 题 · 一到六年级的计算全部闯完了！';
      $('#verdict').className = 'verdict good';
      celebrateDots();
      toast('全部闯关完成', '30 多关都过了，可以回头任选一关继续练');
      state.n = 0;
      autoTimer = setTimeout(newQuestion, 2400);
    }
    return;
  }

  saveProg(); renderPath();
  $('#verdict').textContent = '正确 · 连对 ' + prog.streak + '/' + GOAL;
  $('#verdict').className = 'verdict good';
  autoTimer = setTimeout(newQuestion, 1200);
}

function onWrong(wrongD, wrongC){
  state.answered = true;
  const prev = prog.streak;
  prog.streak = 0;
  saveProg(); renderPath();
  const bits = [];
  if(wrongD) bits.push('数字错 ' + wrongD + ' 位');
  if(wrongC) bits.push('进位错 ' + wrongC + ' 处');
  $('#verdict').textContent = bits.join('，')
    + (prev ? ' · 连对中断（' + prev + ' → 0）' : '')
    + ' · 正确答案 ' + state.q.answer;
  $('#verdict').className = 'verdict err';
}

function celebrateDots(){
  document.querySelectorAll('#dots .pdot').forEach(d=>d.classList.add('on'));
  $('#dots').classList.add('win');
  $('#cnt').textContent = GOAL + '/' + GOAL;
  setTimeout(()=>{ renderPath(); }, 1500);
}

function check(){
  if(state.playing || state.answered) return;
  const q = state.q;
  let wrongD = 0, wrongC = 0, filled = 0;

  q.inputs.forEach(inp=>{
    const el = document.querySelector('[data-id="'+inp.id+'"]');
    const v = (state.res[inp.id]||'').trim();
    if(v) filled++;
    if(!el) return;
    el.classList.remove('ok','bad');
    if(v === inp.ans) el.classList.add('ok');
    else { el.classList.add('bad'); wrongD++; }
  });

  q.carries.forEach(c=>{
    const v = state.car[c.id] || '';
    const btn = document.querySelector('.carry[data-cid="'+c.id+'"]');
    if(btn) btn.classList.remove('miss');
    if(v !== c.ans){
      wrongC++;
      if(btn){
        btn.classList.add('pop');
        setTimeout(()=>btn.classList.remove('pop'), 400);
        /* 没标 / 标错的进位用红圈提示，一眼看到漏在哪一位 */
        if(!v) btn.classList.add('miss');
      }
    }
  });

  if(filled === 0 && state.design!=='dial'){
    $('#verdict').textContent = '先把每一位填上，再点检查。';
    $('#verdict').className = 'verdict';
    return;
  }

  if(wrongD + wrongC === 0) onRight();
  else onWrong(wrongD, wrongC);
}

/* =========================================================
   9. 交互
   ========================================================= */
function focusNext(cur){
  const all = Array.from(document.querySelectorAll('.vinp'));
  const i = all.indexOf(cur);
  for(let k=1;k<all.length;k++){
    const n = all[(i+k)%all.length];
    if(!n.value){ n.focus(); return; }
  }
}

let dragGuard = 0;   /* 刚拖完时，屏蔽紧随其后的 click */

$('#stage').addEventListener('click', e=>{
  const btn = e.target.closest('.dbtn');
  if(btn && !state.playing && !state.answered && Date.now() - dragGuard > 320){
    const dial = btn.closest('.dial');
    const id = dial.dataset.id;
    const next = (Number(state.res[id]||0) + Number(btn.dataset.step) + 10) % 10;
    setResult(id, next);
    dial.classList.add('on');
    dial.classList.remove('ok','bad');
    setTimeout(()=>dial.classList.remove('on'), 650);
    return;
  }
  const car = e.target.closest('.carry');
  if(car && !state.playing && !state.answered){
    const cid = car.dataset.cid;
    const item = state.q.carries.find(x=>x.id===cid);
    if(!item) return;
    const neg = item.ans.charAt(0)==='-';
    /* 进位：+1 → +2 → +3；需要更大的进位（如乘法进 8）时按答案放宽上限 */
    const seq = neg
      ? ['','-1','-2','-3']
      : [''].concat(Array.from({length:Math.max(3, Number(item.ans)||1)}, (_,i)=>String(i+1)));
    const i = seq.indexOf(state.car[cid]||'');
    setCarry(cid, seq[(i+1)%seq.length], neg);
  }
});

/* 手指拖动拨轮：跟手转动，松手吸附到最近的数字 */
let drag = null;
$('#stage').addEventListener('touchstart', e=>{
  const d = e.target.closest('.dial');
  drag = null;
  if(!d || state.playing || state.answered) return;
  drag = {
    el: d,
    id: d.dataset.id,
    y0: e.touches[0].clientY,
    base: Number(state.res[d.dataset.id] || 0),
    dh: d.querySelector('.dnum').offsetHeight || 46,
    dy: 0,
    moved: false
  };
}, {passive:true});

$('#stage').addEventListener('touchmove', e=>{
  if(!drag) return;
  const dy = e.touches[0].clientY - drag.y0;
  if(!drag.moved){
    if(Math.abs(dy) < 4) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    drag.el.classList.remove('ok','bad');
  }
  e.preventDefault();
  const lim = drag.dh * 2.4;
  drag.dy = Math.max(-lim, Math.min(lim, dy));
  drag.el.querySelector('.dstrip').style.transform =
    'translateY(' + (-(drag.base + DIAL_PAD - 0.5) * drag.dh + drag.dy) + 'px)';
}, {passive:false});

$('#stage').addEventListener('touchend', ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove('dragging');
  if(!d.moved) return;                    /* 只是轻点：交给 click 处理上下箭头 */
  dragGuard = Date.now();
  const steps = Math.round(d.dy / d.dh);
  const v = ((d.base - steps) % 10 + 10) % 10;
  setResult(d.id, v);
  d.el.classList.add('flash');
  setTimeout(()=>d.el.classList.remove('flash'), 440);
}, {passive:true});

$('#stage').addEventListener('touchcancel', ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove('dragging');
  setResult(d.id, d.base);
});

$('#stage').addEventListener('wheel', e=>{
  const dial = e.target.closest('.dial');
  if(!dial || state.playing || state.answered) return;
  e.preventDefault();
  const id = dial.dataset.id;
  const dir = e.deltaY > 0 ? -1 : 1;
  setResult(id, (Number(state.res[id]||0) + dir + 10) % 10);
}, {passive:false});

$('#stage').addEventListener('input', e=>{
  const inp = e.target.closest('.vinp');
  if(!inp) return;
  const v = (inp.value||'').replace(/\D/g,'').slice(-1);
  inp.value = v;
  state.res[inp.dataset.id] = v;
  inp.classList.remove('ok','bad');
  if(v) focusNext(inp);
});

$('#stage').addEventListener('keydown', e=>{
  const inp = e.target.closest('.vinp');
  if(!inp) return;
  if(e.key==='Backspace' && !inp.value){
    const all = Array.from(document.querySelectorAll('.vinp'));
    const i = all.indexOf(inp);
    if(i>0){ all[i-1].focus(); all[i-1].value=''; state.res[all[i-1].dataset.id]=''; }
  }
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const all = Array.from(document.querySelectorAll('.vinp'));
    const i = all.indexOf(inp);
    const n = all[i + (e.key==='ArrowRight'?1:-1)];
    if(n) n.focus();
    e.preventDefault();
  }
});

document.addEventListener('focusin', e=>{
  if(e.target.classList && e.target.classList.contains('vinp')) lastInput = e.target;
});

$('#pad').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b || state.playing || state.answered) return;
  let cur = lastInput;
  if(!cur || !document.contains(cur) || !cur.classList.contains('vinp')){
    const empties = Array.from(document.querySelectorAll('.vinp')).filter(x=>!x.value);
    cur = empties[0] || document.querySelector('.vinp');
  }
  if(!cur) return;
  cur.focus();
  if(b.dataset.k==='del'){ cur.value=''; state.res[cur.dataset.id]=''; }
  else { cur.value = b.dataset.k; state.res[cur.dataset.id] = b.dataset.k; focusNext(cur); }
  cur.classList.remove('ok','bad');
});

$('#plans').addEventListener('click', e=>{
  const p = e.target.closest('.plan');
  if(!p) return;
  state.design = p.dataset.d;
  playToken++;                       /* 切方案时中断正在播的讲解 */
  state.playing = false;
  document.querySelectorAll('.plan').forEach(x=>x.classList.toggle('on', x===p));
  $('#pad').classList.toggle('show', state.design!=='dial');
  $('#stageHint').innerHTML = HINT[state.design] || HINT.dial;
  renderStage();
  resetInputs();
  $('#verdict').textContent = '';
  $('#verdict').className = 'verdict';
});

$('#btnPlay').addEventListener('click', play);
$('#btnCheck').addEventListener('click', check);
$('#btnNext').addEventListener('click', ()=>{ clearTimeout(autoTimer); newQuestion(); });

/* =========================================================
   10. 启动
   ========================================================= */
function newQuestion(){
  clearTimeout(autoTimer);
  playToken++;
  const st = curStage();
  state.q = st.gen();
  state.playing = false;
  state.answered = false;
  state.n++;
  $('#btnPlay').disabled = false;
  $('#qtag').textContent = '第 ' + state.n + ' 题';
  $('#expr').textContent = state.q.expr;
  $('#verdict').textContent = '';
  $('#verdict').className = 'verdict';
  $('#stage').classList.remove('bubble-on');
  $('#calc').classList.remove('on');
  renderStage();
  renderSteps();
  resetInputs();
}

$('#pad').innerHTML = ['1','2','3','4','5','6','7','8','9','0'].map(d=>
  '<button data-k="'+d+'">'+d+'</button>').join('') +
  '<button class="del" data-k="del">删除</button>';

/* 顶部：折叠面板开关 */
$('#btnPanel').addEventListener('click', ()=>{
  const on = $('#panel').classList.toggle('open');
  $('#btnPanel').classList.toggle('open', on);
});
$('#gtabs').addEventListener('click', e=>{
  const b = e.target.closest('.gtab');
  if(!b) return;
  state.gtab = Number(b.dataset.g);
  renderPath();
});
$('#sgrid').addEventListener('click', e=>{
  const b = e.target.closest('.sc');
  if(!b || b.disabled) return;
  const idx = Number(b.dataset.i);
  if(idx > prog.max && !prog.unlock) return;
  prog.i = idx; prog.streak = 0;
  state.n = 0;
  saveProg(); renderPath();
  $('#panel').classList.remove('open');
  $('#btnPanel').classList.remove('open');
  newQuestion();
});
$('#btnUnlockAll').addEventListener('click', ()=>{
  prog.unlock = true; prog.max = STAGES.length-1;
  saveProg(); renderPath();
  toast('已解锁全部关卡', '可以直接跳到你想要的年级和关卡');
});
$('#btnReset').addEventListener('click', ()=>{
  prog = {i:0, streak:0, max:0, unlock:false};
  state.gtab = 0; state.n = 0;
  saveProg(); renderPath();
  $('#panel').classList.remove('open');
  newQuestion();
  toast('进度已清空', '回到一年级第 1 关');
});

renderPath();
newQuestion();
</script>
