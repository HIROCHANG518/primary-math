<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小学数学 1-6 年级 · 知识纲要与闯关练习</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#1b2333;--muted:#6c7789;--line:#e5e9f2;
  --accent:#3b4a6b;--accent-soft:color-mix(in srgb,var(--accent) 12%,#fff);
  --ok:#2fa86b;--bad:#e05656;--r:16px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,#fff 0%,#f7f9fd 100%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,#fff))}
.hero-inner{padding:34px 0 22px}
.badge{display:inline-block;font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;margin-bottom:12px}
h1{font-size:clamp(26px,4vw,38px);margin:0 0 10px;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:640px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:flex;align-items:baseline;gap:7px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- grade tabs ---------- */
.grades{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.gtab{flex:0 0 auto;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;transition:.18s;font-family:inherit}
.gtab:hover{border-color:var(--accent);color:var(--accent)}
.gtab.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:18px;align-items:start;padding:14px 0 40px}
body[data-view="overview"] main{grid-template-columns:1fr}
body[data-view="overview"] .practice{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:0 1px 2px rgba(20,30,60,.03)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.panel-h h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent)}
.practice{position:sticky;top:16px}

/* 搜索 */
.search{width:100%;border:1px solid var(--line);background:#fbfcfe;border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;color:inherit;outline:none;margin-bottom:14px;transition:.15s}
.search:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}

/* 书册 */
.book{margin-bottom:16px}
.book-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
.book-h::after{content:"";flex:1;height:1px;background:var(--line)}
.unit{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:7px;overflow:hidden}
.unit summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;font-size:14px;transition:.15s}
.unit summary:hover{background:#fafbfe}
.unit summary::-webkit-details-marker{display:none}
.unit summary .uc{font-size:11.5px;font-weight:500;color:var(--muted);flex:0 0 auto;margin-right:4px}
.unit summary::after{content:"+";color:var(--muted);font-weight:700;font-size:15px;line-height:1}
.unit[open] summary::after{content:"–"}
.unit[open] summary{background:#fafbfe;color:var(--accent)}
.unit ul{margin:0;padding:4px 18px 13px 30px;color:#3d4759;font-size:13.5px;line-height:1.8}
.unit li{margin:1px 0}
.unit li::marker{color:color-mix(in srgb,var(--accent) 55%,#fff)}

/* roadmap */
body[data-view="overview"] #outline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){body[data-view="overview"] #outline{grid-template-columns:1fr}}
.rm{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:.18s;background:#fff}
body[data-view="overview"] .rm{margin-bottom:0}
.rm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(25,40,80,.08);border-color:color-mix(in srgb,var(--c) 40%,#fff)}
.rm-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.rm-h b{font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.rm-core{font-size:12.5px;color:var(--muted)}
.rm-bands{display:flex;flex-wrap:wrap;gap:6px}
.rm-bands span{font-size:12px;padding:3px 9px;border-radius:7px;background:#f5f7fb;color:#465268;border:1px solid #eef1f8}

/* ---------- 练习 ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.meter{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:#f5f7fb;color:#59647a;font-variant-numeric:tabular-nums}
.pill.hot{background:#fff4e8;color:#c97516}

.quiz{min-height:250px;position:relative}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qtag{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.skip{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;padding:2px 4px;border-radius:6px}
.skip:hover{color:var(--accent);background:var(--accent-soft)}
.qtext{font-size:clamp(22px,3.2vw,30px);font-weight:800;letter-spacing:.01em;text-align:center;padding:22px 8px 24px;line-height:1.5;animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:15px 10px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:.13s;font-family:inherit;color:var(--ink);text-align:center}
.opt:hover:not(.done){border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:#eaf8f0;color:#1b7a4c}
.opt.bad{border-color:var(--bad);background:#fdeeee;color:#b93b3b}
.opt.done{cursor:default}
.opt.md{font-size:19px}
.opt.sm{font-size:16.5px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.06;font-size:.8em;font-weight:700}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:1.6px solid currentColor}

.fb{margin-top:14px;font-size:13.5px;border-radius:11px;padding:12px 14px;display:none;animation:pop .2s}
.fb.show{display:block}
.fb.good{background:#eef9f3;border:1px solid #cdecd9;color:#1b6b45}
.fb.bad{background:#fdf0f0;border:1px solid #f6d8d8;color:#9c3838}
.fb b{font-weight:800}
.fb .next{margin-top:9px;display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.fb .next:hover{filter:brightness(1.06)}

footer{border-top:1px solid var(--line);padding:18px 0 34px;color:var(--muted);font-size:12.5px;text-align:center}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .practice{position:static;order:-1}
}
@media (max-width:520px){
  .hero-inner{padding:26px 0 16px}
  .panel{padding:15px}
  .opt{font-size:19px;padding:13px 8px}
  .stat{padding:6px 12px}
}
</style>
</head>
<body data-view="overview">
<header class="hero">
  <div class="wrap hero-inner">
    <div class="badge">1 – 6 年级 · 人教版</div>
    <h1>小学数学知识<em>纲要</em>与闯关</h1>
    <p class="lead">六个年级、四个领域（数与代数 / 图形与几何 / 统计与概率 / 综合与实践）的完整知识脉络，配即时判题的闯关练习。竖式计算另有<a href="vertical.html" style="color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;font-weight:700">阶梯闯关版</a>（连对 10 题解锁下一阶梯）；每个单元还有<a href="learn/" style="color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;font-weight:700">知识点讲解</a>（动画 + 语音 + 10 道题）。</p>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</header>

<div class="wrap">
  <nav class="grades" id="gradeTabs"></nav>
</div>

<main class="wrap">
  <section class="panel">
    <div class="panel-h">
      <h2 id="outlineTitle">六个年级的主线</h2>
      <span class="qtag" id="unitCount"></span>
    </div>
    <input class="search" id="search" placeholder="搜索知识点，例如：分数、面积、方程、余数" autocomplete="off">
    <div id="outline"></div>
  </section>

  <section class="panel practice">
    <div class="panel-h">
      <h2>闯关练习</h2>
      <div class="meter" id="meter"></div>
    </div>
    <div class="chips" id="topics"></div>
    <div class="quiz" id="quiz"></div>
  </section>
</main>

<footer>纲要按人教版（部编）教材单元顺序整理 · 各版本单元名称略有差异，知识点一致 · 键盘 1–4 选答案、Enter 下一题 · 成绩只保存在本机浏览器</footer>

/* =========================================================
   2. 工具函数
   ========================================================= */
const $ = s => document.querySelector(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; };
const gcd = (a,b) => b ? gcd(b, a%b) : a;
const r2 = x => Math.round(x*100)/100;
const ns = x => String(r2(x));

function numOpts(ans, o){
  o = o || {};
  const step = o.step===undefined?1:o.step;
  const min = o.min===undefined?0:o.min;
  const base = r2(ans);
  const lim = Math.max(2, Math.abs(base) * 3);
  let dif = (o.dif || [1,2,3,4,5]).filter(d => Math.abs(d) <= lim);
  if(!dif.length) dif = [1,2,3];
  const s = new Set([base]);
  const floor = Math.max(min, Math.abs(base) * 0.25);
  const cand = [];
  dif.forEach(d => { cand.push(base+d*step, base-d*step); });
  shuffle(cand).forEach(v => { if(s.size<4){ const x=r2(v); if(x>=floor) s.add(x); } });
  let k=1;
  while(s.size<4){ const x=r2(base+k*step); if(x>=Math.max(min,0)) s.add(x); k++; }
  return shuffle([...s]).map(ns);
}

function numOptsRel(ans, o){
  const base = r2(ans);
  const dec = (String(base).split('.')[1] || '').length;
  let cands;
  if(dec === 0){
    const digits = String(Math.abs(Math.round(base))).length;
    const k = Math.pow(10, Math.max(0, digits - 3));   // 5 位数按 100 偏移，4 位数按 10
    cands = [base+k, base-k, base+2*k, base-2*k, base+3*k, base-3*k, base+5*k, base-5*k];
  } else {
    const u = Math.pow(10, -dec);
    cands = [base+u, base-u, base+2*u, base-2*u, base+10*u, base-10*u];
  }
  const floor = Math.max(1, Math.abs(base) * 0.25);
  const s = new Set([base]);
  for(const c of shuffle(cands)){
    if(s.size >= 4) break;
    const v = r2(c);
    if(isFinite(v) && v >= floor) s.add(v);
  }
  let k2 = 1;
  while(s.size < 4){ s.add(r2(base + k2 * Math.max(1, Math.abs(base)*0.1))); k2++; }
  return shuffle([...s]).map(ns);
}

/* 把 "3/4" 或 "12.5" 解析成数值；"8 余 3" 之类无法解析返回 NaN */
function valOf(s){
  s = String(s).trim();
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(\d+)\/(\d+)$/);
  if(m) return Number(m[1]) / Number(m[2]);
  return NaN;
}
/* 数值相等即视为同一答案（避免 24/56 与 3/7 被当成两个不同选项） */
function same(a, b){
  if(String(a) === String(b)) return true;
  const x = valOf(a), y = valOf(b);
  return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
}

function optsFrom(ans, wrongs){
  const out = [ans];
  const push = w => { if(out.length < 4 && !out.some(o => same(o, w))) out.push(w); };
  shuffle(wrongs.slice()).forEach(push);
  if(out.length < 4){
    const m = String(ans).match(/^(\d+)\/(\d+)$/);
    if(m){
      const a = Number(m[1]), b = Number(m[2]);
      [(a+1)+'/'+b, a+'/'+(b+1), (a+1)+'/'+(b+1), (a+2)+'/'+b, a+'/'+(b+2), simpStr(a,b)].forEach(push);
    } else if(/^\d+(\.\d+)?$/.test(String(ans))){
      const n = parseFloat(ans);
      let k = 1;
      while(out.length < 4 && k < 40){ push(ns(r2(n*(1 + k*0.12)))); k++; }
    }
  }
  return shuffle(out);
}

function simpStr(n,d){
  if(n===0) return '0';
  const g = gcd(Math.abs(n), Math.abs(d));
  n/=g; d/=g;
  if(d===1) return String(n);
  return n + '/' + d;
}

      if(t===2) return { q:k+' × 99 + '+k+' = ?', ans:String(100*k), opts:numOptsRel(100*k,{ratios:[0.1,0.5,2,1.5]}),
        tip:'乘法分配律：'+k+' × 99 + '+k+' × 1 = '+k+' × (99 + 1) = '+k+' × 100 = '+(100*k)+'。' };
      return { q:'25 × '+k+' × 4 = ?', ans:String(100*k), opts:numOptsRel(100*k,{ratios:[0.1,0.5,2,1.5]}),
        tip:'乘法交换律：25 × 4 = 100，再乘 '+k+' 得 '+(100*k)+'。' };
  }},
  { name:'角的度量', gen(){
      const A=ri(30,100), B=ri(25,170-A), C=180-A-B;
      return { q:'一个三角形中，两个角分别是 '+A+'° 和 '+B+'°，第三个角是多少度？', ans:String(C),
               opts:numOpts(C,{dif:[1,5,10,30],min:1}),
               tip:'三角形内角和是 180°，180° − '+A+'° − '+B+'° = '+C+'°。' };
  }}
],
5:[
  { name:'小数乘法', gen(){
      let A=ri(11,99); if(A%10===0) A+=ri(1,9);
      const a=A/10, b=ri(2,9), ans=r2(a*b);
      return { q:ns(a)+' × '+b+' = ?', ans:ns(ans), opts:numOptsRel(ans,{ratios:[0.1,0.01,2,10]}),
               tip:'先按整数乘法算 '+Math.round(a*10)+' × '+b+'，再点上一位小数。' };
  }},
  { name:'小数除法', gen(){
      let Q=ri(11,99); if(Q%10===0) Q+=ri(1,9);
      const d=ri(2,9), q=Q/10, a=r2(d*q);
      return { q:ns(a)+' ÷ '+d+' = ?', ans:ns(q), opts:numOptsRel(q,{ratios:[0.1,0.01,2,10]}),
               tip:'把除数变成整数，被除数同时扩大相同倍数，商不变。' };
  }},
  { name:'多边形面积', gen(){
      const t=ri(1,3);
      if(t===1){
        const b=ri(4,20), h=ri(2,12), ans=b*h;
        return { q:'平行四边形的底是 '+b+' 厘米，高是 '+h+' 厘米，面积是多少平方厘米？', ans:String(ans),
                 opts:numOpts(ans,{dif:[1,2,3,h,b]}),
                 tip:'平行四边形面积 = 底 × 高 = '+b+' × '+h+' = '+ans+' 平方厘米。' };
      }
      if(t===2){
        const b=ri(3,10)*2, h=ri(2,12), ans=b*h/2;
        return { q:'三角形的底是 '+b+' 厘米，高是 '+h+' 厘米，面积是多少平方厘米？', ans:String(ans),
                 opts:numOpts(ans,{dif:[1,2,b,h]}),
                 tip:'三角形面积 = 底 × 高 ÷ 2 = '+b+' × '+h+' ÷ 2 = '+ans+' 平方厘米。' };
      }
      const a=ri(3,12), b=ri(a+1,20), h=ri(2,10)*2, ans=(a+b)*h/2;
      return { q:'梯形上底 '+a+' 厘米、下底 '+b+' 厘米、高 '+h+' 厘米，面积是多少平方厘米？', ans:String(ans),
               opts:numOpts(ans,{dif:[1,2,a+b,10]}),
               tip:'梯形面积 =（上底 + 下底）× 高 ÷ 2 =（'+a+' + '+b+'）× '+h+' ÷ 2 = '+ans+' 平方厘米。' };
  }},
  { name:'异分母分数加减', gen(){
      const pairs=[[2,3],[3,4],[2,5],[3,5],[4,5],[3,7],[5,6],[2,7]];
      const p=pairs[ri(0,pairs.length-1)];
      const d1=p[0], d2=p[1];
      const a=ri(1,d1-1), b=ri(1,d2-1);
      const N=a*d2+b*d1, D=d1*d2;
      const ans=simpStr(N,D);
      return { q:a+'/'+d1+' + '+b+'/'+d2+' = ?', ans,
               opts:optsFrom(ans,[N+'/'+D, (a+b)+'/'+(d1+d2), N+'/'+(d1+d2), simpStr(a*d2,D)]),
               tip:'先通分：公分母取 '+D+'，'+(a*d2)+'/'+D+' + '+(b*d1)+'/'+D+' = '+N+'/'+D+' = '+ans+'。' };
  }},
  { name:'因数与倍数', gen(){
      const pairs=[[12,18],[8,12],[6,9],[15,20],[10,15],[16,24],[9,12],[14,21],[18,24]];
      const p=pairs[ri(0,pairs.length-1)];
      const g=gcd(p[0],p[1]), l=p[0]*p[1]/g;
      const askG = Math.random()<0.5;
      const ans = askG ? g : l;
      return { q:'求 '+p[0]+' 和 '+p[1]+' 的'+(askG?'最大公因数':'最小公倍数')+'。', ans:String(ans),
               opts:numOpts(ans,{dif:[1,2,3,6]}),
               tip:(askG?'最大公因数是两个数公有质因数的积':'最小公倍数 = 两数之积 ÷ 最大公因数')+'，答案是 '+ans+'。' };
  }}
],
6:[
  { name:'分数乘法', gen(){
      const d1=ri(3,9), a=ri(1,d1-1), d2=ri(3,9), b=ri(1,d2-1);
      const ans=simpStr(a*b,d1*d2);
      return { q:a+'/'+d1+' × '+b+'/'+d2+' = ?', ans,
               opts:optsFrom(ans,[(a*b)+'/'+(d1*d2), (a+b)+'/'+(d1+d2), (a*b)+'/'+(d1+d2), simpStr(a*d2,d1*b)]),
               tip:'分子相乘、分母相乘：('+a+'×'+b+') / ('+d1+'×'+d2+') = '+(a*b)+'/'+(d1*d2)+' = '+ans+'。' };
  }},
  { name:'分数除法', gen(){
      const d1=ri(3,9), a=ri(1,d1-1), d2=ri(3,9), b=ri(1,d2-1);
      const ans=simpStr(a*d2,d1*b);
      return { q:a+'/'+d1+' ÷ '+b+'/'+d2+' = ?', ans,
               opts:optsFrom(ans,[simpStr(a*b,d1*d2), (a*d2)+'/'+(d1*b), (a+b)+'/'+(d1+d2), simpStr(d1*b,a*d2)]),
               tip:'除以一个分数等于乘它的倒数：'+a+'/'+d1+' × '+d2+'/'+b+' = '+ans+'。' };
  }},
  { name:'圆', gen(){
      const r=ri(2,10);
      if(Math.random()<0.5){
        const ans=r2(2*3.14*r);
        return { q:'一个圆的半径是 '+r+' 厘米，它的周长是多少厘米？（π 取 3.14）', ans:ns(ans),
                 opts:numOptsRel(ans,{ratios:[0.5,2,0.25,1.5]}),
                 tip:'C = 2πr = 2 × 3.14 × '+r+' = '+ns(ans)+' 厘米。' };
      }
      const ans=r2(3.14*r*r);
      return { q:'一个圆的半径是 '+r+' 厘米，它的面积是多少平方厘米？（π 取 3.14）', ans:ns(ans),
               opts:numOptsRel(ans,{ratios:[0.5,2,0.25,1.5]}),
               tip:'S = πr² = 3.14 × '+r+'² = '+ns(ans)+' 平方厘米。' };
  }},
  { name:'百分数与折扣', gen(){
      const zs=[5,6,7,8,9,7.5,8.5,6.5];
      const z=zs[ri(0,zs.length-1)];
      const p=ri(2,20)*20;
      const ans=r2(p*z/10);
      return { q:'一件商品原价 '+p+' 元，打 '+z+' 折出售，现价是多少元？', ans:ns(ans),
               opts:optsFrom(ns(ans),[ns(r2(p-p*z/10)), ns(r2(p*(10-z)/10)), ns(r2(p*z/100)), ns(p)]),
               tip:'打 '+z+' 折就是按原价的 '+(z*10)+'% 出售：'+p+' × '+(z/10)+' = '+ns(ans)+' 元。' };
  }},
  { name:'圆柱与圆锥', gen(){
      const r=ri(2,6), h=ri(3,10);
      const base=r2(3.14*r*r);
      if(Math.random()<0.5){
        const ans=r2(base*h);
        return { q:'一个圆柱的底面半径 '+r+' 厘米、高 '+h+' 厘米，体积是多少立方厘米？（π 取 3.14）', ans:ns(ans),
                 opts:numOptsRel(ans,{ratios:[0.33,3,0.5,2]}),
                 tip:'V = Sh = 3.14 × '+r+'² × '+h+' = '+ns(ans)+' 立方厘米。' };
      }
      const ans=r2(base*h/3);
      return { q:'一个圆锥的底面半径 '+r+' 厘米、高 '+h+' 厘米，体积是多少立方厘米？（π 取 3.14）', ans:ns(ans),
               opts:numOptsRel(ans,{ratios:[3,0.5,2,0.33]}),
               tip:'V = ⅓Sh = ⅓ × 3.14 × '+r+'² × '+h+' = '+ns(ans)+' 立方厘米。' };
  }}
]
};

/* =========================================================
   4. 状态与渲染
   ========================================================= */
const state = { g:0, topic:0, cur:null, answered:false, streak:0 };
let stats = {};
try { stats = JSON.parse(localStorage.getItem('pm_stats') || '{}') || {}; } catch(e){ stats = {}; }
function saveStats(){ try { localStorage.setItem('pm_stats', JSON.stringify(stats)); } catch(e){} }

let autoTimer = null;
function clearAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }

const fmt = s => String(s).replace(/(\d+)\/(\d+)/g, '<span class="fr"><i>$1</i><i>$2</i></span>');
const hl = (s,kw) => s.split(kw).join('<b style="color:var(--accent)">'+kw+'</b>');
const unitTotal = () => DATA.reduce((s,d)=>s+d.books.reduce((a,b)=>a+b.units.length,0),0);

function totalStats(){
  let c=0,t=0;
  for(const k in stats){ c += stats[k].c || 0; t += stats[k].t || 0; }
  return {c,t};
}

function applyAccent(){
  const d = DATA.find(x=>x.g===state.g);
  document.documentElement.style.setProperty('--accent', d ? d.color : '#3b4a6b');
}

function renderHero(){
  const {c,t} = totalStats();
  const rate = t ? Math.round(c/t*100) : 0;
  $('#heroStats').innerHTML =
    '<div class="stat"><b>'+t+'</b><span>已答题</span></div>' +
    '<div class="stat"><b>'+c+'</b><span>答对</span></div>' +
    '<div class="stat"><b>'+rate+'%</b><span>正确率</span></div>' +
    '<div class="stat"><b>'+unitTotal()+'</b><span>个知识单元</span></div>';
}

function renderTabs(){
  const tabs = [{g:0,name:'总览'}].concat(DATA.map(d=>({g:d.g,name:d.name})));
  $('#gradeTabs').innerHTML = tabs.map(t =>
    '<button class="gtab '+(t.g===state.g?'on':'')+'" data-g="'+t.g+'">'+t.name+'</button>'
  ).join('');
}

function renderOutline(){
  const kw = $('#search').value.trim();
  if(state.g===0){
    $('#outlineTitle').textContent = '六个年级的主线';
    $('#unitCount').textContent = '共 ' + unitTotal() + ' 个单元';
    $('#search').style.display = 'none';
    $('#outline').innerHTML = DATA.map(d =>
      '<div class="rm" data-g="'+d.g+'" style="--c:'+d.color+'">' +
        '<div class="rm-h"><span class="dot"></span><b>'+d.name+'</b><span class="rm-core">'+d.ov.core+'</span></div>' +
        '<div class="rm-bands">'+d.ov.bands.map(b=>'<span>'+b+'</span>').join('')+'</div>' +
      '</div>'
    ).join('');
    return;
  }
  $('#search').style.display = '';
  const g = DATA.find(d=>d.g===state.g);
  const cnt = g.books.reduce((a,b)=>a+b.units.length,0);
  $('#outlineTitle').textContent = g.name + '知识纲要';
  $('#unitCount').textContent = cnt + ' 个单元';

  if(kw){
    const hits = [];
    g.books.forEach(b => b.units.forEach(u => {
      if(u.t.indexOf(kw)>=0){ hits.push({term:b.term, t:u.t, points:u.p}); return; }
      const ps = u.p.filter(p => p.indexOf(kw)>=0);
      if(ps.length) hits.push({term:b.term, t:u.t, points:ps});
    }));
    $('#outline').innerHTML = hits.length
      ? hits.map(h =>
          '<div class="unit" style="padding:12px 14px;margin-bottom:8px">' +
            '<div style="font-weight:700;font-size:14px;margin-bottom:5px">'+h.t+
              '<span class="uc" style="margin-left:8px">'+h.term+'</span></div>' +
            '<ul style="padding:0 0 0 22px">'+h.points.map(p=>'<li>'+hl(p,kw)+'</li>').join('')+'</ul>' +
          '</div>').join('')
      : '<p style="color:#6c7789;font-size:13.5px">没有找到包含「'+kw+'」的知识点。可以试试：分数、面积、方程、余数、图形。</p>';
    return;
  }

  $('#outline').innerHTML = g.books.map(b =>
    '<div class="book"><div class="book-h">'+b.term+'</div>' +
    b.units.map((u,i) =>
      '<details class="unit"'+(i===0?' open':'')+'>' +
        '<summary><span>'+u.t+'</span><span class="uc">'+u.p.length+' 个要点</span></summary>' +
        '<ul>'+u.p.map(p=>'<li>'+p+'</li>').join('')+'</ul>' +
      '</details>'
    ).join('') + '</div>'
  ).join('');
}

function renderMeter(){
  const s = stats[state.g] || {c:0,t:0};
  const rate = s.t ? Math.round(s.c/s.t*100) : 0;
  $('#meter').innerHTML =
    '<span class="pill">答对 '+s.c+' / '+s.t+'</span>' +
    '<span class="pill">正确率 '+rate+'%</span>' +
    '<span class="pill '+(state.streak>=3?'hot':'')+'">连对 '+state.streak+'</span>';
}

function renderQuestion(){
  clearAuto();
  const tps = TOPICS[state.g];
  if(!tps) return;
  if(state.topic >= tps.length) state.topic = 0;
  const t = tps[state.topic];
  const q = t.gen();
  state.cur = q;
  state.answered = false;
  const done = (stats[state.g] ? stats[state.g].t : 0) + 1;
  const maxLen = Math.max.apply(null, q.opts.map(o => String(o).length));
  const ocls = maxLen > 7 ? ' sm' : (maxLen > 5 ? ' md' : '');
  $('#quiz').innerHTML =
    '<div class="qhead"><span class="qtag">'+t.name+' · 第 '+done+' 题</span>' +
      '<button class="skip" data-act="skip">换一题</button></div>' +
    '<div class="qtext">'+fmt(q.q)+'</div>' +
    '<div class="opts">'+q.opts.map((o,i)=>'<button class="opt'+ocls+'" data-i="'+i+'">'+fmt(o)+'</button>').join('')+'</div>' +
    '<div class="fb" id="fb"></div>';
}

function nextQuestion(){
  clearAuto();
  renderQuestion();
}

function pick(i){
  if(state.answered || !state.cur) return;
  state.answered = true;
  const cur = state.cur;
  const chosen = cur.opts[i];
  const ok = same(chosen, cur.ans);

  document.querySelectorAll('#quiz .opt').forEach((b,idx) => {
    b.classList.add('done');
    if(same(cur.opts[idx], cur.ans)) b.classList.add('ok');
    else if(idx === i) b.classList.add('bad');
  });

  const s = stats[state.g] || (stats[state.g] = {c:0,t:0});
  s.t++; if(ok) s.c++;
  state.streak = ok ? state.streak + 1 : 0;
  saveStats();
  renderMeter();
  renderHero();

  const fb = $('#fb');
  fb.className = 'fb show ' + (ok ? 'good' : 'bad');
  fb.innerHTML =
    (ok ? '<b>答对了</b> · ' : '<b>正确答案：' + fmt(cur.ans) + '</b> · ') + fmt(cur.tip) +
    '<br><button class="next" data-act="next">' + (ok ? '下一题' : '再练一题') + '</button>';

  if(ok){
    autoTimer = setTimeout(() => { if(state.answered) nextQuestion(); }, 2000);
  }
}

function renderPractice(){
  const tps = TOPICS[state.g];
  state.topic = 0;
  state.streak = 0;
  $('#topics').innerHTML = tps.map((t,i) =>
    '<button class="chip '+(i===0?'on':'')+'" data-t="'+i+'">'+t.name+'</button>'
  ).join('');
  renderMeter();
  renderQuestion();
}

function renderAll(){
  clearAuto();
  applyAccent();
  renderTabs();
  renderOutline();
  renderHero();
  if(state.g === 0){
    document.body.dataset.view = 'overview';
  } else {
    document.body.dataset.view = 'grade';
    renderPractice();
  }
}

/* =========================================================
   5. 事件
   ========================================================= */
$('#gradeTabs').addEventListener('click', e => {
  const b = e.target.closest('.gtab');
  if(!b) return;
  const g = Number(b.dataset.g);
  if(g === state.g) return;
  state.g = g;
  $('#search').value = '';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
});

$('#outline').addEventListener('click', e => {
  const rm = e.target.closest('.rm');
  if(!rm) return;
  state.g = Number(rm.dataset.g);
  $('#search').value = '';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
});

$('#topics').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if(!c) return;
  state.topic = Number(c.dataset.t);
  state.streak = 0;
  document.querySelectorAll('#topics .chip').forEach(x => x.classList.toggle('on', x === c));
  renderMeter();
  renderQuestion();
});

$('#quiz').addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if(opt && !opt.classList.contains('done')){
    pick(Number(opt.dataset.i));
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act && act.dataset.act === 'next') nextQuestion();
  if(act && act.dataset.act === 'skip') nextQuestion();
});

$('#search').addEventListener('input', renderOutline);

document.addEventListener('keydown', e => {
  if(state.g === 0) return;
  if(e.key >= '1' && e.key <= '4'){
    const btns = document.querySelectorAll('#quiz .opt');
    const i = Number(e.key) - 1;
    if(btns[i]) btns[i].click();
  }
  if(e.key === 'Enter'){
    const n = document.querySelector('#quiz [data-act="next"]');
    if(n) n.click();
  }
});

/* =========================================================
   6. 启动
   ========================================================= */
renderAll();
</script>
