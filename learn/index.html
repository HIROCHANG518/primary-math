<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识点讲解 · 小学数学 1-6 年级</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f1f4fa;--card:#fff;--ink:#151c2c;--muted:#6b7588;--line:#e3e8f2;
  --pri:#4a63d8;--pri-soft:#eef1ff;--ok:#1f9c66;--bad:#dc4f4f;--warn:#e8961a;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
a{color:var(--pri);text-decoration:none}

.hero{padding:26px 0 6px}
.hero h1{margin:0 0 6px;font-size:25px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:13.5px}
.hero .links{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.hero .links a{border-bottom:1px solid rgba(74,99,216,.28)}

.stats{display:flex;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 14px;min-width:104px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}

.gtabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 12px}
.gtab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 13px;font-size:12.5px;
  font-weight:700;color:#68738c;cursor:pointer;font-family:inherit}
.gtab.on{background:#1d2739;border-color:#1d2739;color:#fff}

.term{margin:16px 0 6px;font-size:12px;font-weight:800;color:#98a2b8;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
.unit{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:block;
  transition:.16s;position:relative;overflow:hidden}
.unit:hover{border-color:#c2cce8;transform:translateY(-1px);box-shadow:0 12px 26px -20px rgba(20,30,60,.5)}
.unit .ut{font-size:15px;font-weight:800;margin:0 0 5px;display:flex;align-items:center;gap:7px}
.unit .ut i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.unit .pts{font-size:11.5px;color:var(--muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit .meta{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:#9aa5bb}
.tag{font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px}
.tag.ready{background:#e7f7ef;color:var(--ok)}
.tag.study{background:#fff5e6;color:var(--warn)}
.tag.todo{background:#f1f4fa;color:#9aa5bb}
.unit.todo{opacity:.72}
.unit.todo:hover{transform:none;box-shadow:none}
.unit .go{position:absolute;right:12px;top:12px;font-size:11px;color:#c3cbe0}
.footnote{font-size:11.5px;color:#9aa5bb;text-align:center;margin-top:26px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>知识点讲解</h1>
    <p>按人教版单元顺序，一个单元一节课：动画演示 + 语音讲解 + 10 道题，答对 8 题算掌握。</p>
    <div class="links">
      <a href="../vertical.html">竖式闯关 →</a>
      <a href="../index.html">知识纲要 →</a>
      <a href="checklist.html">知识点核对表 →</a>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="gtabs" id="gtabs"></div>
  <div id="body"></div>

  <div class="footnote">讲解语音由昕哥音色生成 · 进度只保存在本机浏览器</div>
</div>

<script src="data/outline.js"></script>
<script src="data/lessons/ids.js"></script>
<script>
const PROG_KEY = 'learn_prog_v1';
const prog = (() => { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } })();
const ready = new Set(window.LESSON_IDS || []);
let curG = Number(new URLSearchParams(location.search).get('g') || 1);

const allUnits = OUTLINE.grades.reduce((s, g) => s + g.books.reduce((x, b) => x + b.units.length, 0), 0);
const allPoints = OUTLINE.grades.reduce((s, g) => s + g.books.reduce((x, b) => x + b.units.reduce((y, u) => y + u.p.length, 0), 0), 0);
let doneUnits = 0, donePoints = 0;
OUTLINE.grades.forEach(g => g.books.forEach(b => b.units.forEach(u => {
  if (prog[u.id] && prog[u.id].done) { doneUnits++; donePoints += u.p.length; }
})));

document.getElementById('stats').innerHTML =
  '<div class="stat"><b>' + ready.size + '<span style="font-size:13px;color:#9aa5bb"> / ' + allUnits + '</span></b><span>单元已上线</span></div>' +
  '<div class="stat"><b>' + donePoints + '<span style="font-size:13px;color:#9aa5bb"> / ' + allPoints + '</span></b><span>知识点已掌握</span></div>' +
  '<div class="stat"><b>' + doneUnits + '</b><span>单元通过</span></div>';

document.getElementById('gtabs').innerHTML = OUTLINE.grades.map(g =>
  '<button class="gtab" data-g="' + g.g + '">' + g.name + '</button>').join('');

function unitStatus(id) {
  const p = prog[id];
  if (p && p.done) return ['study', '已掌握'];
  if (p && p.quiz !== undefined) return ['study', '做过 ' + p.quiz + ' 题'];
  return null;
}

function render() {
  document.querySelectorAll('.gtab').forEach(t => t.classList.toggle('on', Number(t.dataset.g) === curG));
  const g = OUTLINE.grades.find(x => x.g === curG);
  let html = '';
  g.books.forEach(b => {
    html += '<div class="term">' + g.name + ' · ' + b.term + '</div><div class="grid">';
    b.units.forEach(u => {
      const isReady = ready.has(u.id);
      const st = unitStatus(u.id);
      const tag = isReady
        ? (st ? '<span class="tag ' + st[0] + '">' + st[1] + '</span>' : '<span class="tag ready">可学习</span>')
        : '<span class="tag todo">待制作</span>';
      const inner =
        '<div class="ut"><i style="background:' + g.color + '"></i>' + u.t + '</div>' +
        '<div class="pts">' + u.p.join(' · ') + '</div>' +
        '<div class="meta">' + u.p.length + ' 个要点 ' + tag + '</div>';
      html += isReady
        ? '<a class="unit" href="lesson.html?id=' + u.id + '">' + inner + '<span class="go">→</span></a>'
        : '<div class="unit todo">' + inner + '</div>';
    });
    html += '</div>';
  });
  document.getElementById('body').innerHTML = html;
}

document.getElementById('gtabs').addEventListener('click', e => {
  const b = e.target.closest('.gtab');
  if (!b) return;
  curG = Number(b.dataset.g);
  history.replaceState(null, '', '?g=' + curG);
  render();
});
render();
</script>
</body>
</html>
